    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sets the theme before anything renders, so there's no flash of
         the wrong theme while React loads. ThemeToggle.jsx reads this
         same attribute as its starting value, and keeps it in sync with
         localStorage from then on. -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
