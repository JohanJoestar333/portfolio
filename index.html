<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thomas — Software QA Analyst</title>
    <meta
      name="description"
      content="Software QA Analyst portfolio featuring manual testing, exploratory testing, Cypress automation, and an interactive QA Lab."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Thomas — Software QA Analyst" />
    <meta
      property="og:description"
      content="Software QA Analyst portfolio featuring manual testing, exploratory testing, Cypress automation, and an interactive QA Lab."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sets the theme before anything renders, so there's no flash of
         the wrong theme while React loads. ThemeToggle.jsx reads this
         same attribute as its starting value, and keeps it in sync with
         localStorage from then on. -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
